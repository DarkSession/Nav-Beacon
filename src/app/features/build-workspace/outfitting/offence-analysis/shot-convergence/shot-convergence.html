<!--
  Canvas 1c's `SHOT CONVERGENCE` block: the gunsight plate, the same diagram in
  words, and the range the plate is drawn at.

  Every mount is one dot and nothing else since 2026-08-27 (Commander request).
  The hardpoint numeral set beside each dot is withdrawn, along with the leaders
  and the ring a crowded plate used to put them out on: what a mount is — armed,
  empty, or the one the workspace has open — is three fills of one shape, and
  which mount it is is the first thing its own sentence below says.
-->
<div class="convergence">
  <!--
    The gunsight plate. Decorative in full: every shot on it is stated in
    words in the list below, which is what actually reports the spread. A
    shot outside the plate's field of view is left off the drawing and keeps
    the sentence that states where it really goes.
  -->
  <div class="plate" aria-hidden="true">
    <span class="plate__axis plate__axis--vertical"></span>
    <span class="plate__axis plate__axis--horizontal"></span>

    <!--
      The boresight the 2026-08-26 revision adds: a hairline ring on the axis.
      It is where the hull points, so it is what every shot is offset *from* —
      the one mark on this plate that is a property of the drawing rather than
      of the build, which is why it takes no state and needs no sentence of its
      own. The canvas's filled dot at its centre is withdrawn (2026-08-27): on a
      plate of dots it read as a shot landing dead on the axis.
    -->
    <span class="plate__boresight"></span>

    <!--
      The two dashed rings. Each is a circle in *angle*, and on a box that is
      square that makes it a circle in pixels too: the canvas corrects a ring's
      height by the box's own `offsetWidth / offsetHeight`, which here is one.
      `aspect-ratio` is that correction, without measuring anything.
    -->
    @for (ring of rings(); track ring.milliradians) {
      <span class="plate__ring" [style.width.%]="ring.width * 100"></span>
    }

    <!--
      Every one of the hull's hardpoints, as one dot where its shot lands.

      An empty hardpoint is drawn too, in the stale amber that says a mount is
      there with nothing on it: where a mount sits is a property of the hull
      rather than of what is on it, and a Commander deciding what to fit is
      asking exactly where a shot from that mount would go. The selected mount
      takes the plate's third ink. Nothing is ringed or outlined — the three
      states are three fills of one shape — and all three are written out in
      the list below, along with the one the plate does not draw at all: how
      each weapon aims.

      A shot the frame cannot hold is left off it rather than pinned to the
      edge, because the field of view is a property of the drawing and never
      widens to fit a build. It is exactly the case where the sentence beside
      the plate is the reading: it states the offset and the angle the shot
      really has, whether or not there is a dot for it (FR-011).
    -->
    @for (shot of shots(); track shot.id) {
      @if (shot.onPlate) {
        <span
          class="plate__dot"
          [class.plate__dot--empty]="!shot.armed"
          [class.plate__dot--selected]="shot.selected"
          [style.left.%]="shot.left"
          [style.top.%]="shot.top"
        ></span>
      }
    }
  </div>

  <!--
    The same diagram in words. This is the reading; the plate above is the
    picture of it, and every mark on it is restated here — the empty
    hardpoints and the selected mount with the rest, because those are two
    of the three things the plate's inks separate. Each sentence names the
    hardpoint and carries the offset and the angle that mount's shot really
    has, which is the whole of what the withdrawn numerals used to point at.
  -->
  <ul class="shots" [attr.aria-label]="plateLabel()">
    @for (shot of shots(); track shot.id) {
      <li class="shots__entry">{{ shot.statement }}</li>
    }
  </ul>

  <!--
    The range, under the plate at every width, as the canvas draws it. The
    2026-08-26 revision leaves the range alone in this readout.
  -->
  <div class="convergence__readout">
    <ednb-range-field
      class="convergence__range"
      [label]="rangeLabel()"
      [min]="rangeBounds.min"
      [max]="rangeBounds.max"
      [step]="rangeBounds.step"
      [value]="targetRange()"
      [valueText]="targetRangeText()"
      [minText]="rangeMinText()"
      [maxText]="rangeMaxText()"
      (changed)="setTargetRange($event)"
    />
  </div>
</div>
