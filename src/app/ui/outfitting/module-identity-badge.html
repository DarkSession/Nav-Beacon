<span class="identity">
  <!--
    The name and whatever marks it, on one line. Canvas 1c draws the route icon
    of a restricted module in the name's own row — `Advanced Plasma Accelerator`
    with the Powerplay mark 7px after it — and the code line below the two. A
    marker projected after the whole badge landed under the code line instead,
    which is a third line the canvas does not have.
  -->
  <span class="identity__line">
    <ednb-game-text
      class="identity__name"
      [class.identity__name--compact]="compact()"
      [attr.data-text-reachable]="cut() ? '' : null"
      [text]="name().text"
      [language]="name().language"
      [translationState]="name().translationState"
    >
      <!--
        The ellipsis, made reachable, and projected into the game text so it
        lands against the value it abbreviates rather than after whatever else
        the line carries. It draws the `…` and `text-overflow` does not, because
        a browser paints that one and no thumb can ask it what it stands for. It
        is the same presentational tooltip the route marks on this line already
        use: a span rather than a button, because the row around it is itself a
        control, and hidden from the accessibility tree because the whole name
        is in the DOM beside it and is read out whole whatever the drawing does
        with it.
      -->
      @if (nameTip(); as tip) {
        @if (cut()) {
          <ednb-tooltip
            class="identity__more"
            aria-hidden="true"
            [presentational]="true"
            [tip]="tip"
            >…</ednb-tooltip
          >
        }
      }
    </ednb-game-text>
    <!--
      Canvas 1c's class chip on a dense ledger row. Its text stays inside the
      row's button, so the button's name reads the module name and then `4A`,
      and the spoken class and rating below follow it.
    -->
    @if (classChip()) {
      @if (code(); as chip) {
        <span class="identity__chip" data-bidi-isolate>{{ chip }}</span>
      }
    }
    <ng-content />
  </span>

  <!--
    One line, one ink, as canvas 1d writes it: `4A GIMBALLED · OVERCHARGED G5 ·
    CORROSIVE`. With the class chip, the `4A` is on the name line instead. The
    class and rating are read out in words beside it rather than left as a code,
    and a package symbol is bidi-isolated so two different modules cannot look
    like one in a right-to-left reading.
  -->
  @if (codeLine(); as line) {
    <span class="identity__code-line" data-bidi-isolate>{{ line }}</span>
  }
  @if (codeDescription(); as description) {
    <span class="visually-hidden">{{ description }}</span>
  }
</span>
