<section
  class="group"
  [attr.aria-labelledby]="headingId"
  [attr.data-density]="dense() ? 'dense' : null"
>
  <div class="group__rule">
    <h3 class="group__heading" [id]="headingId">{{ heading() }}</h3>
    <!-- Canvas 1c's `SIZE · NODE NO.` under the hardpoint rule, naming the two
         badges every row in that group leads with. -->
    @if (columns(); as columns) {
      <span class="group__columns">{{ columns }}</span>
    }
    <span class="group__line" aria-hidden="true"></span>

    <!-- The canvas writes a bare number at the rule's trailing edge. What it
         counts is spoken beside it rather than drawn, so the rule reads as the
         canvas draws it and a reader still hears "8 mounts". -->
    <span class="group__count" aria-hidden="true">{{ group().slots.length }}</span>
    <span class="visually-hidden">{{ count() }}</span>
  </div>

  <!--
    The list items are projected by the workspace, which owns the card and its
    intents. The group owns the heading, the rule and the list semantics — the
    part that is the same for every kind.
  -->
  <ul class="group__slots">
    <ng-content />
  </ul>
</section>
