<!--
  The secondary button on the row's own selection control empties the mount. It
  is a pointer shortcut and never the only route: `REMOVE MODULE` on the bench
  is the drawn control at both widths, and a Commander clearing several mounts
  in a row should not have to travel to it for each one (Commander request
  2026-08-28). It is bound to the selection control rather than to the row, so
  the power chip beside it keeps the platform's menu over its own controls.
  Touch reaches the same operation through the bench, so a long press keeps the
  platform's menu too.
-->
<div
  class="slot"
  [attr.data-selected]="selected() ? 'true' : null"
  [attr.data-density]="dense() ? 'dense' : null"
  [attr.data-slot-key]="slot().key"
>
  <span class="visually-hidden" [id]="identityId">{{ identityText() }}</span>

  <button
    class="slot__select"
    type="button"
    [attr.aria-pressed]="selected() ? 'true' : 'false'"
    [attr.aria-describedby]="identityId"
    (click)="emit({ kind: 'select' })"
    (contextmenu)="removeFromPointer($event)"
  >
    <span class="slot__mount">
      <!--
        Drawn on every row but a utility mount's, empty where the package
        states no size. Canvas 1c draws a utility row with its blue node number
        alone, because a utility mount has no size to show. Armour keeps the
        box.
      -->
      @if (nodeKind() !== 'utility') {
        <span class="slot__size">{{ slot().size }}</span>
      }
      <!--
        The mount's number on the hull anatomy. Hardpoints carry it in the
        canvas's amber; utility mounts carry the same number in the anatomy's
        own blue, which is how that drawing already tells the two apart. Every
        other kind has no node to point at — a power plant is not somewhere on
        the hull a Commander looks for.
      -->
      @if (nodeKind(); as kind) {
        <span class="slot__node" [attr.data-kind]="kind">{{ slot().node }}</span>
      }
    </span>

    <span class="slot__identity">
      @if (slot().module !== null) {
        <ednb-module-identity-badge
          [name]="slot().module!.displayName"
          [nameTip]="slot().module!.displayName.text"
          [symbol]="slot().module!.symbol"
          [moduleClass]="slot().module!.article?.class ?? null"
          [rating]="slot().module!.article?.rating ?? null"
          [mount]="slot().module!.article?.mount ?? null"
          [detail]="engineeringSummary()"
          [classChip]="dense()"
        >
          <!--
            How the module in this mount is obtained, drawn exactly as the
            chooser draws it on the row it was taken from: canvas 1c marks the
            fitted `Advanced Plasma Accelerator` the same way it marks the row
            that offered it, beside the name and on the name's own line. The
            restriction did not stop being true when the module moved, and a
            Commander reading their build back has no chooser open to find it
            in.
          -->
          <ednb-acquisition-badge class="slot__acquisition" [labels]="slot().module!.labels" />
        </ednb-module-identity-badge>
        <!--
          The canvas gives a fitted row two lines: the module's name and its
          code line. The mount's own kind, size and node are the size box, the
          node badge and the group's `SIZE · NODE NO.` rule above — drawing them
          a third time in the row was the compact card's stack on a desktop, so
          here they are spoken and not drawn.
        -->
        <span class="visually-hidden">{{ drawnLabel() }}</span>
      } @else {
        <span class="slot__empty">{{ emptyLabel() }}</span>
        <!--
          The mount is the size box and the node badge beside it, and the group
          rule above them. Writing `Hardpoints · Size 4 · Node 1` under an
          `Empty` said all three a second time in words (wave 5).
        -->
        <span class="visually-hidden">{{ drawnLabel() }}</span>
      }
    </span>

    @if (selected()) {
      <span class="visually-hidden">{{ selectedLabel() }}</span>
    }
  </button>

  <!--
    The priority control the canvas draws at the end of every ledger row, and
    the power switch beside it. Both sit outside the selection control rather
    than inside it: the canvas nests a clickable control in a clickable row, and
    a reader cannot tell which of the two they are on (reference review,
    "Interaction and semantics").
  -->
  @if (showsPower()) {
    <ednb-power-controls
      class="slot__power"
      [slotLabel]="drawnLabel()"
      [moduleLabel]="moduleLabel()"
      [enabled]="slot().module!.enabled"
      [priority]="slot().module!.priority"
      [canSetEnabled]="capabilities().canSetEnabled"
      [canSetPriority]="capabilities().canSetPriority"
      (intent)="emit($event)"
    />
  }

  <!--
    The canvas's engineered mark, after the power chip as canvas 1c orders the
    row's tail. Decorative: the code line above already writes `OVERCHARGED G5`
    in words, so the icon repeats what is read rather than carrying it
    (FR-010 of feature 011).
  -->
  @if (engineeringSummary()) {
    <img
      class="slot__engineered"
      src="assets/icons/engineered.svg"
      alt=""
      [attr.title]="engineeredLabel()"
      width="15"
      height="15"
    />
  } @else {
    <!--
      Its place is kept whether or not the row carries one, exactly as the
      canvas keeps it. Without this the rows above and below an engineered
      module sit a marker's width further along than it does, and a column of
      forty rows stops being a column (canvas 1c).
    -->
    <span class="slot__engineered" aria-hidden="true"></span>
  }
</div>
