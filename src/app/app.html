<ednb-app-frame
  [routeContext]="pageName()"
  [routeCount]="pageCount()"
  [tools]="tools()"
  [home]="home()"
  [actions]="actions()"
  [status]="statusNotices()"
  [held]="heldContent()"
  [heldLanguage]="heldLanguage"
  [heldHeight]="heldHeight"
  [back]="back()"
  [identity]="identity()"
  (actionSelected)="selectAction($event)"
  (identityOpened)="chrome.openIdentity($event)"
  (identityClosed)="chrome.closeIdentity()"
  (identityCommitted)="chrome.commitIdentity($event)"
  (navigationSelected)="navigateFromShell($event)"
  (toolSelected)="selectTool($event)"
>
  <router-outlet />
</ednb-app-frame>

<!--
  Loaded when a Commander asks for one, not before. Both layers are deferred
  together because they share the store the shell already holds, and because
  the first of them to be opened pays the load either way.
-->
@defer (when exchangeWanted()) {
  <ednb-slef-import-dialog />
  <ednb-slef-export-dialog />
}

<!--
  The saved builds, as the layer canvas 1a draws: over the screen a Commander is
  on, with that screen inert behind it rather than replaced by it. Mounted here
  beside the frame for the same reason help is — the list of stored builds
  belongs to no screen in particular — and deferred, because a Commander who
  never opens it should never pay for it.

  It has no address of its own. Opening it takes a history entry at the address
  a Commander is already on, so the back button closes it and the screen behind
  survives — a saved build is something you reach for from wherever you are
  rather than somewhere you go (Commander request 2026-09-04).
-->
@defer (when library.open()) {
  @if (library.open()) {
    <ednb-build-library-page />
  }
}

<!--
  The five layers that talk to a Commander about the session they are in
  rather than about a screen: Help · About, the Commander account, the two
  halves of the update announcement, and the statement that the application is
  waiting for a screen.

  All five are mounted in a browser only, and this is the one place in this
  template that asks which. Each of them is a closed `<dialog>` until something
  opens it, so rendering them into a generated document draws nothing, moves
  nothing and costs a Commander no frame — but two of them state the version
  the session is running, which CI stamps into `package.json` immediately
  before `ng build`. A body carrying it would bake a CI-only value into static
  HTML, which is the runtime environment configuration a prerendered document
  may not carry (015/FR-007, constitution 9.1.0, research decision 14).

  Mounting them a moment later rather than blanking what they say keeps each
  one's own contract whole. Help still opens on the first offline visit,
  because the browser mounts it before anything can ask for it, and it still
  names the running version, because by then something is running. There is no
  session to announce an update to until there is a session, and no navigation
  to wait on either.
-->
@if (interactive) {
  <!--
    Help · About, beside the frame and never inside a capability. Eager rather
    than deferred: help has to open on the first offline visit after one
    completed load, and a chunk fetched on activation is a request waiting to
    fail (012/FR-001).
  -->
  <ednb-help-dialog
    [open]="help.open()"
    [view]="help.view()"
    [dismissLabel]="help.dismissLabel()"
    (dismissed)="help.closeDialog()"
  />

  <!--
    The Commander account, beside the frame for the same reason help is: an
    account belongs to the session rather than to a screen. Browser-only, and
    eager rather than deferred, because the modal is also where a refused
    sign-in callback and an expired session are stated, and a chunk fetched on
    activation is a request that has nothing to say when the network is the
    thing that failed (020/FR-001, 020/FR-003).
  -->
  <ednb-account-dialog
    [open]="account.open()"
    [view]="account.view()"
    (dismissed)="account.closeDialog()"
    (actionSelected)="account.select($event)"
    (deletionConfirmed)="account.confirmDeletion()"
    (deletionCancelled)="account.cancelDeletion()"
  />

  <!--
    The overlay a newer version puts up before it restarts the page under it.

    It is a layer with no dismiss label, which is what leaves it with no
    control, no Escape and no ground to click: the restart is announced rather
    than asked about, so there is nothing here to answer. That is a time limit
    a Commander cannot stop, and constitution V names WCAG 2.2.1 among the
    excluded criteria for this one mechanism.
  -->
  <ednb-layer
    [open]="updateOverlay()"
    [title]="updateOverlayTitle()"
    [description]="updateOverlayNotice()"
    [dismissLabel]="null"
  />

  <!--
    And the other half of the announcement, drawn by the session that came up
    on the newer version. The overlay above is gone with the page that drew it;
    this is the half a Commander who looked away is certain to read, and it
    names the version they landed on. Dismissed like any other layer, and after
    a few seconds by itself as well — nothing is pending behind it, because the
    update is already applied.
  -->
  <ednb-layer
    [open]="updateApplied()"
    [title]="updateAppliedTitle()"
    [description]="updateAppliedNotice()"
    [dismissLabel]="updateAppliedDismiss()"
    (dismissed)="acknowledgeUpdate()"
  >
    <p class="app__update-detail">{{ updateAppliedDetail() }}</p>
  </ednb-layer>

  <!--
    The statement that the application is waiting for a screen a Commander
    asked for. Beside the frame with the other three, because it belongs to the
    session rather than to any screen, and under the same browser-only
    condition, because a document the build generates has no navigation to wait
    on and must carry nothing over its first frame (018/FR-008).

    It is held down while the restart overlay stands. That text has to stay
    visible, and a navigation running under a restart is not going to finish.
  -->
  <ednb-waiting-overlay [open]="waitingOverlay()" [text]="waitingText()" />
}
