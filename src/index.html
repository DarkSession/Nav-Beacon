<!doctype html>
<!--
  The host document, not a component template.

  It is served before Angular runs and is the only thing a crawler that executes
  no script ever sees, so every phrase in it is the English default for the root
  address, which answers with the start page. What that address resolves to is
  the product rather than one of its tools, so the title family carries
  `app.document-title.default` and the descriptions carry `app.description`,
  while `application-name`, `og:site_name` and the JSON-LD `name` carry the bare
  name. This file is
  the document the root address answers with:
  `publish-static-routes.mjs` writes the root's own head into it through the same
  substitution every other address goes through. The locale store replaces the title, the
  description, the canonical link and both card blocks on the first committed
  snapshot, in whichever language the browser asked for (011/FR-027). The policy
  checker holds the addresses here to `SITE_ORIGIN`, and holds this file, the
  sitemap, the robots file and the manifest to the same origin as each other.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Nav Beacon – Elite Dangerous Commander Tools</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nav Beacon is a set of Elite Dangerous tools. Ship Builder is its outfitting bench: pick a hull, outfit it, read the numbers, and share a build as a link."
    />
    <link rel="canonical" href="https://navbeacon.app/" />

    <!-- Stated rather than left to a default, so that the one deployment that
         must not be indexed can say so by rewriting this one tag: a preview is
         built with a sub-path base href and `ci.yml` turns this into `noindex`
         there. `max-image-preview:large` lets a result show the card at the
         size it was drawn. -->
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- The dark theme is the only theme (011/FR-003); saying so keeps the
         browser from drawing a light frame around it before the styles land. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="application-name" content="Nav Beacon" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nav Beacon" />
    <meta property="og:title" content="Nav Beacon – Elite Dangerous Commander Tools" />
    <meta
      property="og:description"
      content="Nav Beacon is a set of Elite Dangerous tools. Ship Builder is its outfitting bench: pick a hull, outfit it, read the numbers, and share a build as a link."
    />
    <meta property="og:url" content="https://navbeacon.app/" />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="https://navbeacon.app/assets/link-card.png" />
    <meta property="og:image:alt" content="Nav Beacon – Elite Dangerous Commander Tools" />

    <!-- The card carries the mark on the application's own ground and no words:
         a picture with `NAV BEACON` baked into it is display text in one
         language that no translation can reach (constitution VI). What the
         picture is gets said in `og:image:alt`, which is rewritten with the
         title and so moves with the language. `scripts/generate-brand-assets.mjs`
         renders it; a hull address is published with its own illustration
         instead. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nav Beacon – Elite Dangerous Commander Tools" />
    <meta
      name="twitter:description"
      content="Nav Beacon is a set of Elite Dangerous tools. Ship Builder is its outfitting bench: pick a hull, outfit it, read the numbers, and share a build as a link."
    />
    <meta name="twitter:image" content="https://navbeacon.app/assets/link-card.png" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- The faces a served document draws with, fetched beside the document
         rather than after the stylesheet that declares them. Without this a
         document paints in a system fallback and re-paints a moment later, and
         the text changes shape in front of the Commander.

         These seven are what a served document is drawn in, measured on the
         built output with the bundle held. Fifty-one of the fifty-three published
         addresses arrive with their content rendered, in three shapes — the
         start page, the catalogue and a hull — and all three were measured. The
         two benches and the fallback arrive as an empty shell, so they paint no
         face until the application takes them over. JetBrains Mono 700 is drawn
         through a weight nothing declares — the mark beside a shell action asks
         for 600, and 700 is the face the browser matches it to. The `latin`
         subset covers every language the application ships, German included.
         Every other face — the `latin-ext` subsets, and the weights only a
         screen draws — is fetched when something asks for it, which is after
         the application has taken the document over.

         Each path is relative, like every other path this document asks for: a
         leading slash sends a preview deployment's fonts to the host root.
         `crossorigin` is what makes the preload count — a font is fetched in
         anonymous mode whatever its origin, and a preload declared without it
         is a second, unused request. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/barlow/barlow-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/barlow/barlow-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/barlow-condensed/barlow-condensed-latin-600-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/barlow-condensed/barlow-condensed-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/jetbrains-mono/jetbrains-mono-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/jetbrains-mono/jetbrains-mono-latin-500-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/jetbrains-mono/jetbrains-mono-latin-700-normal.woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nav Beacon",
        "url": "https://navbeacon.app/",
        "description": "Nav Beacon is a set of Elite Dangerous tools. Ship Builder is its outfitting bench: pick a hull, outfit it, read the numbers, and share a build as a link.",
        "image": "https://navbeacon.app/assets/link-card.png",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "inLanguage": ["en", "de"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
